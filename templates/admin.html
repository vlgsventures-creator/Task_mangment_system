<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLGS Admin Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <link rel="manifest" href="/static/manifest.json">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "bf1e7c43-6bd2-4b2e-8a3f-87c686f7482a",
      allowLocalhostAsSecureOrigin: true, // Laptop localhost testing ke liye ZAROORI hai
      notifyButton: {
        enable: true // Screen ke kono par Red Bell Icon dikhayega
      }
    });

    OneSignal.Notifications.requestPermission();
  });
</script>    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #222;
            padding-bottom: 90px;
        }

        /* HEADER */
        .header {
            background: #fff;
            padding: 15px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,.04);
            border-bottom: 1px solid #eaeaea;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .header-left h2 {
            font-size: 22px;
            font-weight: 700;
            color: #2d2d2d;
        }

.brand-header {
    display: flex;
    align-items: center;
    gap: 16px;           
    margin-top: 4px;
}

/* --- LOGO WRAPPER (BIG SIZE FIX) --- */
.logo-wrapper {
    width: 55px;         /* साइज को 38px से बढ़ाकर 65px कर दिया है */
    height: 55px;        /* साइज को 38px से बढ़ाकर 65px कर दिया है */
    background: #e1dfdc;
    border-radius: 16px; /* थोड़े बड़े और स्मूथ कॉर्नर्स */
    border: 1.5px solid rgba(75, 58, 199, 0.18); /* थोडा डार्क पर्पल बॉर्डर */
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(75, 58, 199, 0.08); /* हैवी और प्रीमियम शैडो */
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.logo-wrapper img {
    width: 100%;         /* इमेज को बॉक्स के अंदर और बड़ा दिखाने के लिए */
    height: 100%;
    object-fit: contain; /* लोगो बिना स्ट्रेच हुए बड़ा और साफ़ दिखेगा */
}

/* --- DATE & DAY META TEXT --- */
.brand-meta {
    font-size: 13px;
    font-weight: 500;
    color: #4a5568;
    background: #f0f4fe; /* हल्का पर्पल-ब्लू बैकग्राउंड कैप्सूल */
    padding: 6px 16px;
    border-radius: 30px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid rgba(75, 58, 199, 0.05);
}

.brand-meta #todayDay {
    color: #4b3ac7;
    font-weight: 600;
}

/* --- INTERACTIVE HOVER EFFECT --- */
.brand-header:hover .logo-wrapper {
    transform: translateY(-3px) scale(1.02); /* होवर करने पर लोगो थोडा सा और उभरेगा */
    border-color: #4b3ac7;
    box-shadow: 0 12px 25px rgba(75, 58, 199, 0.18);
}
        .brand-header:hover .logo-wrapper {
            transform: translateY(-2px);
            border-color: #4b3ac7;
            box-shadow: 0 6px 15px rgba(75, 58, 199, 0.15);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .notification {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            transition: 0.2s;
        }

        .notification:hover {
            background: #e4e7ec;
        }

        .notification i {
            font-size: 18px;
            color: #4a5568;
        }

        .badge {
            position: absolute;
            top: 2px;
            right: 2px;
            min-width: 18px;
            height: 18px;
            padding: 0 4px;
            background: #ef4444;
            color: #fff;
            border-radius: 50%;
            font-size: 10px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CONTENT */
        .container {
            padding: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 5px 18px rgba(0,0,0,.04);
            border: 1px solid #eaeaea;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .card h4 {
            color: #718096;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .card h2 {
            font-size: 32px;
            color: #0d6efd;
            font-weight: 700;
        }

        /* BOTTOM NAVIGATION */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #fff;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0;
            box-shadow: 0 -5px 20px rgba(0,0,0,.05);
            z-index: 999;
        }

        .nav-btn {
            border: none;
            background: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #718096;
            cursor: pointer;
            flex: 1;
            transition: .3s;
            text-decoration: none;
        }

        .nav-btn i {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .nav-btn span {
            font-size: 12px;
            font-weight: 500;
        }

        .nav-btn.active {
            color: #0d6efd;
        }

        .nav-btn.active i {
            transform: scale(1.1);
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            border: none;
            outline: none;
            background: #ef4444;
            color: #fff;
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: .3s;
        }

        .logout-btn:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        @media(max-width:768px) {
            .logout-btn span {
                display: none;
            }
            .logout-btn {
                width: 42px;
                height: 42px;
                padding: 0;
                justify-content: center;
                border-radius: 50%;
            }
            .header {
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <h2>VLGS Workspace</h2>
            <div class="brand-header">
                <div class="logo-wrapper">
                    <img src="{{ url_for('static', filename='vlgs_logo.png') }}" alt="VLGS Logo">
                </div>
                <div class="brand-meta">
                    <span id="todayDay"></span> •
                    <span id="todayDate"></span>
                </div>
            </div> 
        </div> <div class="header-right">
            <div class="notification" onclick="window.location.href='/admin_notify'">
                <i class="fa-solid fa-bell"></i>
                <span class="badge" id="notificationCount" style="display: none;">0</span>
            </div>
            
            <button id="logoutBtn" class="logout-btn">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </button>
        </div>
    </header>

    <div class="container">
        <div class="cards">
            <div class="card">
                <h4>Total Employees</h4>
                <h2 id="employeeCount">0</h2>
            </div>
            <div class="card">
                <h4>Total Tasks</h4>
                <h2 id="taskCount">0</h2>
            </div>
            <div class="card">
                <h4>Pending Tasks</h4>
                <h2 id="pendingCount">0</h2>
            </div>
            <div class="card">
                <h4>Completed Tasks</h4>
                <h2 id="completedCount">0</h2>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-btn" onclick="window.location.href='/add_employee'">
            <i class="fa-solid fa-user-plus"></i>
            <span>Add Employee</span>
        </button>

        <button class="nav-btn" onclick="window.location.href='/admin_logs'">
            <i class="fa-solid fa-user"></i>
            <span>Emp Logs</span>
        </button>

        <button class="nav-btn active" onclick="window.location.href='/add-task'">
            <i class="fa-solid fa-plus"></i>
            <span>Assign Task</span>
        </button>

        <button class="nav-btn" onclick="window.location.href='/task-records'">
            <i class="fa-solid fa-list-check"></i>
            <span>Task Records</span>
        </button>

        <button class="nav-btn" onclick="window.location.href='/edit_employee_page'">
    <i class="fa-solid fa-user-gear"></i>
    <span>Manage Emp</span>
</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            loadDashboard();
            updateDate();
            fetchAdminNotificationCount();
        });

        // Load Counts Data
        async function loadDashboard() {
            try {
                const response = await fetch("/api/dashboard_counts");
                const data = await response.json();

                document.getElementById("employeeCount").innerText = data.employees || 0;
                document.getElementById("taskCount").innerText = data.tasks || 0;
                document.getElementById("pendingCount").innerText = data.pending || 0;
                document.getElementById("completedCount").innerText = data.completed || 0;
            } catch (error) {
                console.error("Dashboard Engine Error:", error);
            }
        }

        // Live Date Logic
        function updateDate() {
            const now = new Date();
            const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

            document.getElementById("todayDay").innerText = days[now.getDay()];
            document.getElementById("todayDate").innerText = `${String(now.getDate()).padStart(2, "0")} ${months[now.getMonth()]} ${now.getFullYear()}`;
        }

        // Fetch Live Notification Count From Back-end
        async function fetchAdminNotificationCount() {
            try {
                const response = await fetch("/api/admin_notification_count");
                const data = await response.json();
                const badge = document.getElementById("notificationCount");
                
                if (data.count && data.count > 0) {
                    badge.innerText = data.count;
                    badge.style.display = "flex";
                } else {
                    badge.style.display = "none";
                }
            } catch (error) {
                console.error("Error fetching notification count:", error);
            }
        }

        // Logout Event
        document.getElementById("logoutBtn").addEventListener("click", function () {
            if (confirm("Are you sure you want to logout?")) {
                localStorage.clear();
                sessionStorage.clear();
                window.location.replace("/");
            }
        });
    </script>
</body>
</html>
