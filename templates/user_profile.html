<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hub | VLGS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
    
    <link rel="manifest" href="/static/manifest.json">
    <script src=\"https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js\" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "bf1e7c43-6bd2-4b2e-8a3f-87c686f7482a",
    });
  });
</script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body {
            background: #f4f6fc;
            color: #1e293b;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* HEADER & BACK BUTTON STYLES */
        .profile-header-bar {
            background: #fff;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 4px 12px rgba(0,0,0,.03);
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            background: #f1f5f9;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #475569;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: #e2e8f0;
            color: #6C63FF;
            transform: scale(1.05);
        }

        .back-btn i {
            font-size: 16px;
        }

        .profile-header-bar h2 {
            font-size: 20px;
            font-weight: 600;
            color: #0f172a;
        }

        .wrapper {
            max-width: 500px;
            margin: 20px auto;
            padding: 0 16px;
        }

        /* CARD COMPONENT */
        .card {
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            padding: 28px;
            text-align: center;
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
            position: relative;
        }

        /* AVATAR STYLES */
        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 16px auto;
        }

        .profile-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 8px 20px rgba(108,99,255,0.2);
            background: #f1f5f9;
        }

        .upload-badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: #6C63FF;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 3px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: 0.2s;
        }

        .upload-badge:hover {
            transform: scale(1.1);
            background: #5b52e0;
        }

        #avatarInput { display: none; }

        .user-name { font-size: 22px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
        .user-email { font-size: 13px; color: #64748b; margin-bottom: 12px; font-weight: 400; }
        
        .badge-team {
            display: inline-block;
            background: #f0fdf4;
            color: #16a34a;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #bbf7d0;
        }

        /* GRID INFO */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 24px;
            text-align: left;
        }

        .info-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 14px;
            border-radius: 16px;
        }

        .info-box label {
            display: block;
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .info-box p {
            font-size: 13px;
            color: #334155;
            font-weight: 500;
        }

        /* METRICS TRACKING PANELS */
        .metrics-title {
            text-align: left;
            font-size: 15px;
            font-weight: 600;
            color: #334155;
            margin: 24px 0 12px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .metric-card {
            background: #fff;
            border-radius: 20px;
            padding: 18px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            margin-bottom: 12px;
            text-align: left;
        }

        .metric-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            margin-bottom: 8px;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%; /* Dynamic animation target */
            border-radius: 10px;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bg-purple { background: #6C63FF; }
        .bg-green { background: #10b981; }

        /* FOOTER BRANDING */
        .footer-brand {
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
            margin-top: 30px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="profile-header-bar">
        <button class="back-btn" onclick="window.location.href='/user'">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <h2>Profile Hub</h2>
    </div>

    <div class="wrapper">
        
        <div class="card">
            <div class="avatar-container">
                <img id="profile-img" class="profile-avatar" src="/static/default-avatar.png" alt="Avatar">
                <label for="avatarInput" class="upload-badge">
                    <i class="fa-solid fa-camera"></i>
                </label>
                <input type="file" id="avatarInput" accept="image/*">
            </div>

            <h3 class="user-name" id="profileName">Loading Profile...</h3>
            <p class="user-email" id="profileEmail">...</p>
            <span class="badge-team" id="profileTeam">General Core</span>

            <div class="info-grid">
                <div class="info-box">
                    <label>Employee Code</label>
                    <p id="labelEmpCode">--</p>
                </div>
                <div class="info-box">
                    <label>Joining Date</label>
                    <p id="labelJoining">--/--/----</p>
                </div>
                <div class="info-box">
                    <label>Date of Birth</label>
                    <p id="labelDob">--/--/----</p>
                </div>
                <div class="info-box">
                    <label>System Rank</label>
                    <p style="color: #6C63FF; font-weight:600;">Associate</p>
                </div>
            </div>
        </div>

        <div class="metrics-title">
            <i class="fa-solid fa-chart-pie" style="color: #6C63FF;"></i>
            <span>Performance Analytics</span>
        </div>

        <div class="metric-card">
            <div class="metric-header">
                <span>Task Completion Ratio</span>
                <span id="labelProductivity" style="font-weight: 600; color:#6C63FF;">0%</span>
            </div>
            <div class="progress-container">
                <div id="barProductivity" class="progress-bar bg-purple"></div>
            </div>
        </div>

        <div class="metric-card">
            <div class="metric-header">
                <span>Response & Velocity Index</span>
                <span id="labelResponse" style="font-weight: 600; color:#10b981;">100% Smooth</span>
            </div>
            <div class="progress-container">
                <div id="barResponse" class="progress-bar bg-green"></div>
            </div>
        </div>

        <div class="footer-brand">
            POWERED BY VLGS WORKSPACE ARCHITECTURE • 2026
        </div>

    </div>

    <script>
        // Extract Session Scope Identity
        const employeeId = localStorage.getItem("employee_id");

        if (!employeeId) {
            alert("No secure user token detected. Redirecting to gateway.");
            window.location.replace("/");
        }

        document.addEventListener("DOMContentLoaded", function() {
            loadUserProfileBlueprints();
        });

        // 1. Core Profile API Hydration Engine
        function loadUserProfileBlueprints() {
            fetch(`/api/employee_profile/${employeeId}`)
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const profile = data.profile;
                    
                    // Hydrate Text Structures
                    document.getElementById("profileName").innerText = profile.name;
                    document.getElementById("profileEmail").innerText = profile.email;
                    document.getElementById("profileTeam").innerText = profile.team || "General Core";
                    document.getElementById("labelEmpCode").innerText = profile.emp_code || `EMP-2026${String(employeeId).padStart(2, '0')}`;
                    
                    // Safe Date Processing
                    document.getElementById("labelJoining").innerText = profile.joining_date || "Not Listed";
                    document.getElementById("labelDob").innerText = profile.dob || "Not Listed";

                    // Base64 Visual Stream Recovery
                    if (profile.profile_pic) {
                        document.getElementById("profile-img").src = profile.profile_pic;
                    }

                    // Request task payload matrix to evaluate progress structures
                    evaluatePerformanceMetrics();
                } else {
                    alert("Failed to decode profile credentials.");
                }
            })
            .catch(err => console.error("Identity collection anomaly:", err));
        }

        // 2. Metrics Evaluation Processing Unit
        async function evaluatePerformanceMetrics() {
            try {
                const response = await fetch(`/api/tasks/${employeeId}`);
                const tasks = await response.json();

                if (!Array.isArray(tasks)) return;

                const totalTasks = tasks.length;
                const completedTasks = tasks.filter(t => t.status === "Completed").length;
                const totalDelayed = tasks.filter(t => t.status === "Overdue").length;

                calculateAndAnimateBars(totalTasks, completedTasks, totalDelayed);
            } catch (error) {
                console.error("Performance calculations aborted:", error);
            }
        }

        function calculateAndAnimateBars(total, completed, totalDelayed) {
            // 1. Calculate Productivity
            const productivityPercentage = total > 0 ? Math.round((completed / total) * 100) : 0;
            
            // 2. Inject to UI Elements
            document.getElementById("labelProductivity").innerText = productivityPercentage + "%";
            setTimeout(() => {
                document.getElementById("barProductivity").style.width = productivityPercentage + "%";
            }, 200);

            // 3. Process Response Rate mapping dynamically
            const calculatedResponseRate = Math.max(100 - (totalDelayed * 10), 40);
            document.getElementById("labelResponse").innerText = calculatedResponseRate + "% Smooth";
            setTimeout(() => {
                document.getElementById("barResponse").style.width = calculatedResponseRate + "%";
            }, 400);
        }

        // --- 3. BASE64 PHOTO UPLOAD HANDLING ---
        document.getElementById("avatarInput").addEventListener("change", function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onloadend = function() {
                const base64Image = reader.result;

                fetch(`/api/upload_avatar/${employeeId}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ image: base64Image })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById("profile-img").src = base64Image;
                        alert("Profile Picture updated successfully!");
                    } else {
                        alert("Photo upload failed!");
                    }
                }).catch(err => alert("Network error during photo upload."));
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
