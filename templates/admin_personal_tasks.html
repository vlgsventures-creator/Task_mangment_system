<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Personal Notepad | VLGS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f4f6fc; color: #1e293b; padding-bottom: 90px; }

        .header-bar {
            background: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 16px;
            box-shadow: 0 4px 12px rgba(0,0,0,.03); border-bottom: 1px solid #e2e8f0;
            position: sticky; top: 0; z-index: 100;
        }
        .back-btn {
            background: #f1f5f9; border: none; width: 40px; height: 40px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer; color: #475569; transition: 0.2s;
        }
        .back-btn:hover { background: #e2e8f0; color: #4A90E2; transform: scale(1.05); }
        .header-bar h2 { font-size: 20px; font-weight: 600; color: #0f172a; }

        .wrapper { max-width: 600px; margin: 30px auto; padding: 0 16px; }
        .task-card { background: #fff; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); padding: 24px; border: 1px solid #e2e8f0; }
        
        .form-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .form-control { width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 14px; outline: none; }
        .form-control:focus { border-color: #4A90E2; box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1); }
        
        .btn-add { background: #4A90E2; color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 15px; transition: 0.2s; }
        .btn-add:hover { background: #357abd; }

        .task-list { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .task-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; }
        .task-details { display: flex; align-items: center; gap: 12px; flex: 1; }
        .task-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: #4A90E2; }
        .task-text { font-size: 14px; font-weight: 500; color: #1e293b; }
        .task-text.completed { text-decoration: line-through; color: #94a3b8; }
        .task-deadline { font-size: 11px; color: #94a3b8; display: block; margin-top: 2px; }
        
        .btn-delete { background: none; border: none; color: #ef4444; cursor: pointer; padding: 4px; font-size: 15px; }
        .no-tasks { text-align: center; color: #94a3b8; padding: 30px; font-size: 13px; }

        /* BOTTOM NAV */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; border-top: 1px solid #eee; display: flex; justify-content: space-around; align-items: center; padding: 10px 0; box-shadow: 0 -5px 20px rgba(0,0,0,.05); z-index: 1000; }
        .nav-btn { border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; cursor: pointer; flex: 1; text-decoration: none; gap: 4px; font-size: 12px; }
        .nav-btn i { font-size: 20px; }
        .nav-btn.active { color: #4A90E2; }
    </style>
</head>
<body>

    <div class="header-bar">
        <button class="back-btn" onclick="window.location.href='/admin'"><i class="fa-solid fa-arrow-left"></i></button>
        <h2>Admin Personal Notes</h2>
    </div>

    <div class="wrapper">
        <div class="task-card">
            <form id="taskForm" onsubmit="addAdminTask(event)">
                <div class="form-group">
                    <input type="text" id="taskTitle" class="form-control" placeholder="Admin Memo / Task..." required>
                    <input type="datetime-local" id="taskDeadline" class="form-control" required>
                    <button type="submit" class="btn-add"><i class="fa-solid fa-plus"></i> Save Memo</button>
                </div>
            </form>

            <div class="task-list" id="taskListContainer">
                <!-- Admin items loaded here -->
            </div>
        </div>
    </div>

    <!-- Admin Bottom Navigation Links -->
    <div class="bottom-nav">
        <button class="nav-btn" onclick="window.location.href='/add_employee'">
            <i class="fa-solid fa-user-plus"></i><span>Add Emp</span>
        </button>
        <button class="nav-btn" onclick="window.location.href='/edit_employee_page'">
            <i class="fa-solid fa-user-gear"></i><span>Manage</span>
        </button>
        <button class="nav-btn active" onclick="window.location.href='/admin_personal_tasks'">
            <i class="fa-solid fa-thumbtack"></i><span>My Memo</span>
        </button>
        <button class="nav-btn" onclick="window.location.href='/add-task'">
            <i class="fa-solid fa-plus"></i><span>Assign Task</span>
        </button>
        <button class="nav-btn" onclick="window.location.href='/task-records'">
            <i class="fa-solid fa-list-check"></i><span>Records</span>
        </button>
    </div>

    <script>
        const STORAGE_KEY = "admin_private_memos";

        document.addEventListener("DOMContentLoaded", loadTasks);

        function loadTasks() {
            const tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            const container = document.getElementById("taskListContainer");
            
            if(tasks.length === 0) {
                container.innerHTML = `<p class="no-tasks">No private admin memos found.</p>`;
                return;
            }

            container.innerHTML = tasks.map((task, index) => `
                <div class="task-item">
                    <div class="task-details">
                        <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})">
                        <div>
                            <span class="task-text ${task.completed ? 'completed' : ''}">${task.title}</span>
                            <span class="task-deadline"><i class="fa-regular fa-clock"></i> Target: ${task.deadline.replace('T', ' ')}</span>
                        </div>
                    </div>
                    <button class="btn-delete" onclick="deleteTask(${index})"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            `).join('');
        }

        function addAdminTask(e) {
            e.preventDefault();
            const title = document.getElementById("taskTitle").value.trim();
            const deadline = document.getElementById("taskDeadline").value;

            const tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            tasks.push({ title, deadline, completed: false });
            
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
            document.getElementById("taskForm").reset();
            loadTasks();
        }

        function toggleTask(index) {
            const tasks = JSON.parse(localStorage.getItem(STORAGE_KEY));
            tasks[index].completed = !tasks[index].completed;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
            loadTasks();
        }

        function deleteTask(index) {
            if(confirm("Delete this memo record?")) {
                const tasks = JSON.parse(localStorage.getItem(STORAGE_KEY));
                tasks.splice(index, 1);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
                loadTasks();
            }
        }
    </script>
</body>
</html>
