<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Logs | VLGS Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
     <link rel="manifest" href="/static/manifest.json">
     <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "bf1e7c43-6bd2-4b2e-8a3f-87c686f7482a",
      allowLocalhostAsSecureOrigin: true, // Laptop localhost testing ke liye ZAROORI hai
      notifyButton: {
        enable: true // Screen ke kono par Red Bell Icon dikhayega
      }
    });

    // Device register hote hi external id assign karo
     OneSignal.push(function() {
         OneSignal.setExternalUserId("admin_root");
         console.log("OneSignal Admin Push Registration Successful!");
     });
  });
</script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f4f6fc;
            color: #1e293b;
            padding-bottom: 90px;
        }

        /* HEADER & BACK BUTTON STYLES */
        .header {
            background: #fff;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,.03);
            border-bottom: 1px solid #eaeaea;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            background: #f1f5f9;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #475569;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: #e2e8f0;
            color: #6C63FF;
            transform: scale(1.05);
        }

        .back-btn i {
            font-size: 16px;
        }

        .header h2 {
            font-size: 20px;
            font-weight: 600;
            color: #0f172a;
        }

        .container {
            max-width: 1200px;
            margin: 24px auto;
            padding: 0 20px;
        }

        /* Filter Section Styling */
        .filter-card {
            background: #fff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 200px;
        }

        .filter-group label {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            background: #fff;
            color: #334155;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #6C63FF;
        }

        /* Log Table Containers */
        .log-panel {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.03);
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th {
            background: #f8fafc;
            padding: 16px;
            font-weight: 600;
            color: #475569;
            border-bottom: 2px solid #e2e8f0;
            text-transform: uppercase;
            font-size: 12px;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
            vertical-align: middle;
        }

        tr:hover td {
            background: #f8fafc;
        }

        /* Badges Styling */
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-active {
            background: #dcfce7;
            color: #15803d;
        }

        .status-completed {
            background: #f1f5f9;
            color: #475569;
        }

        code {
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 6px;
            font-family: monospace;
            color: #ef4444;
            font-size: 13px;
        }

        /* BOTTOM NAVIGATION */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #fff;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0;
            box-shadow: 0 -5px 20px rgba(0,0,0,.05);
            z-index: 999;
        }

        .nav-btn {
            border: none;
            background: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #718096;
            cursor: pointer;
            flex: 1;
            transition: .3s;
            text-decoration: none;
        }

        .nav-btn i {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .nav-btn span {
            font-size: 12px;
            font-weight: 500;
        }

        .nav-btn.active {
            color: #6C63FF;
        }
    </style>
</head>
<body>

    <header class="header">
        <button class="back-btn" onclick="window.location.href='/admin'">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <h2>Employee Session Logs</h2>
    </header>

    <div class="container">
        
        <div class="filter-card">
            <div class="filter-group">
                <label for="searchName">Search Employee</label>
                <input type="text" id="searchName" class="form-control" placeholder="Enter name..." oninput="applyFilters()">
            </div>
            <div class="filter-group">
                <label for="filterDate">Filter By Date</label>
                <input type="date" id="filterDate" class="form-control" onchange="applyFilters()">
            </div>
        </div>

        <div class="log-panel">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Employee Name</th>
                            <th>Login Time</th>
                            <th>Logout Time</th>
                            <th>IP Address</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody">
                        <tr>
                            <td colspan="5" style="text-align: center; color: #64748b; padding: 30px;">Loading operational logs...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <div class="bottom-nav">
        <button class="nav-btn" onclick="window.location.href='/add_employee'">
            <i class="fa-solid fa-user-plus"></i>
            <span>Add Emp</span>
        </button>
        <button class="nav-btn" onclick="window.location.href='/edit_employee_page'">
            <i class="fa-solid fa-user-gear"></i>
            <span>Manage Emp</span>
        </button>
        <button class="nav-btn active" onclick="window.location.href='/admin-logs'">
            <i class="fa-solid fa-history"></i>
            <span>Emp Logs</span>
        </button>
        <button class="nav-btn" onclick="window.location.href='/add-task'">
            <i class="fa-solid fa-plus"></i>
            <span>Assign Task</span>
        </button>
        <button class="nav-btn" onclick="window.location.href='/task-records'">
            <i class="fa-solid fa-list-check"></i>
            <span>Task Records</span>
        </button>
    </div>

    <script>
        let rawLogsMaster = [];

        document.addEventListener("DOMContentLoaded", function() {
            fetchMasterSessionLogs();
        });

        // 1. Core Fetch API Pipeline
        async function fetchMasterSessionLogs() {
            try {
                const response = await fetch("/api/admin/employee_logs");
                rawLogsMaster = await response.json();
                renderLogsTable(rawLogsMaster);
            } catch (error) {
                console.error("Critical error pooling engine logs:", error);
                document.getElementById("logsTableBody").innerHTML = `<tr><td colspan="5" style="text-align:center; color:red; padding:20px;">Failed to fetch live database records.</td></tr>`;
            }
        }

        // 2. Render Database Stream to DOM Node
        function renderLogsTable(logs) {
            const tbody = document.getElementById("logsTableBody");
            tbody.innerHTML = "";

            if(logs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: #64748b; padding: 30px;">No operational logs present inside current scope.</td></tr>`;
                return;
            }

            logs.forEach(log => {
                const row = document.createElement("tr");
                
                // Active status check mapping
                const isActive = log.logout_time === "Active Session" || !log.logout_time || log.logout_time === "—";
                const badgeClass = isActive ? "status-badge status-active" : "status-badge status-completed";
                const statusText = isActive ? "Online" : "Disconnected";

                row.innerHTML = `
                    <td><strong>${log.employee_name}</strong></td>
                    <td>${formatEasyDateTime(log.login_time)}</td>
                    <td>${isActive ? '—' : formatEasyDateTime(log.logout_time)}</td>
                    <td><code>${log.ip_address || '0.0.0.0'}</code></td>
                    <td><span class="${badgeClass}">${statusText}</span></td>
                `;
                tbody.appendChild(row);
            });
        }

        // 3. Client Side Live Filtering Processing Core
        function applyFilters() {
            const searchName = document.getElementById("searchName").value.toLowerCase().trim();
            const selectedDate = document.getElementById("filterDate").value; // YYYY-MM-DD

            let filteredLogs = rawLogsMaster;

            // Name filter integration
            if(searchName !== "") {
                filteredLogs = filteredLogs.filter(log => log.employee_name.toLowerCase().includes(searchName));
            }

            // ISO string split mapping for date component evaluations
            if(selectedDate !== "") {
                filteredLogs = filteredLogs.filter(log => {
                    if(!log.login_time) return false;
                    const logDateStr = new Date(log.login_time).toISOString().split('T')[0];
                    return logDateStr === selectedDate;
                });
            }

            renderLogsTable(filteredLogs);
        }

        // 4. Human Readable Timestamp Converter Helper
        function formatEasyDateTime(dateTimeStr) {
            if (!dateTimeStr || dateTimeStr === "—" || dateTimeStr === "Active Session") return "—";
            try {
                const dateObj = new Date(dateTimeStr);
                if (isNaN(dateObj.getTime())) return dateTimeStr;

                const options = { 
                    day: '2-digit', 
                    month: 'short', 
                    year: 'numeric', 
                    hour: '2-digit', 
                    minute: '2-digit',
                    hour12: true 
                };
                return dateObj.toLocaleString('en-US', options);
            } catch (e) {
                return dateTimeStr;
            }
        }
    </script>
</body>
</html>
